spring:
  application:
    name: user-role-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_role_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084