version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: team2-organization-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dummyproject_team2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7675093749
    ports:
      - "5432:5432"
    volumes:
      - team2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  team2_pgdata:
