services:

  postgres:

    image: postgres:16

    container_name: security-session-postgres

    environment:

      POSTGRES_DB: security_session_db

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: admin

    ports:

      - "5432:5432"

    volumes:

      - security_session_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  redis:

    image: redis:7

    container_name: security-session-redis

    ports:

      - "6380:6379"

    volumes:

      - security_session_redis_data:/data

    restart: unless-stopped


  kafka:

    image: apache/kafka:latest

    container_name: security-session-kafka

    ports:

      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1

    volumes:

      - security_session_kafka_data:/var/lib/kafka/data

    restart: unless-stopped


volumes:

  security_session_postgres_data:

  security_session_redis_data:

  security_session_kafka_data: