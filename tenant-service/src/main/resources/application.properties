spring.application.name=tenant-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oneenterprise_tenant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
server.error.include-message=always

# Sprint 2 tenant provisioning/isolation strategy.
# Allowed: SHARED_DATABASE, SCHEMA_PER_TENANT, DEDICATED_DATABASE
# DEDICATED_DATABASE is an infrastructure contract; the application records the intent only.
tenant.provisioning.strategy=${TENANT_PROVISIONING_STRATEGY:SCHEMA_PER_TENANT}
tenant.backup.location=${TENANT_BACKUP_LOCATION:./backups}
