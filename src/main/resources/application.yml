server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: organization-management

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dummyproject_team2}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:7675093749}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.enterprise.organization: DEBUG
