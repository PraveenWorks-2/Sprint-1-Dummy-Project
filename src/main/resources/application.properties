spring.application.name=permission-management-service

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/permission_db
spring.datasource.username=postgres
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=permission-events-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.permission_management_service.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.permission_management_service.kafka.PermissionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
