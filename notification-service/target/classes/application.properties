# ==============================
# Application
# ==============================
spring.application.name=notification-service
server.port=8088

# ==============================
# PostgreSQL DataSource
# ==============================
  spring.datasource.url=jdbc:mysql://localhost:3306/oneenterprise_notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
  spring.datasource.username=root
  spring.datasource.password=Naveen@1622
  spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# Kafka - Common
# ==============================
spring.kafka.bootstrap-servers=localhost:9092

# ==============================
# Kafka - Producer
# ==============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# ==============================
# Kafka - Consumer
# ==============================
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.oneenterprise.notificationservice.kafka

# ==============================
# Kafka Topics used by this service
# ==============================
app.kafka.topic.role-assigned=role-assigned-events
app.kafka.topic.permission-changed=permission-changed-events
app.kafka.topic.security-activity=security-activity-events
app.kafka.topic.notification-events=notification-events
